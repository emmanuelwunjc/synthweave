name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same PR are wasted runner time, and with `strict: true`
# branch protection there are a lot of them: every merge to main rebases the
# queue and re-triggers everything. Cancelling is only safe for pull_request
# though. A `push: main` run is the post-merge safety net and the last place
# a bad merge gets caught, so it is deliberately never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # pyproject.toml pins pandas<3: an unpinned `pandas>=2.0` let a fresh
        # install pull pandas 3.x, which broke the suite on copy-on-write and
        # StringDtype changes. With that pinned, all four supported
        # interpreters run here again.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: PYTHONPATH=src python3 -m pytest tests/ -q
      # `tools/` is linted too: mutation_check.py is tracked, is a required
      # check, and CONTRIBUTING/CLAUDE both document it as covered. It was
      # not actually in this command until 2026-08-02.
      - run: PYTHONPATH=src python3 -m pyflakes src/ tests/ tools/ $([ -d examples ] && echo examples/)

  # A gate, as of #107, which fixed the last of the pandas 3 failures. This
  # installs the latest pandas 3.x over the pinned dependency and runs the
  # suite against it. It is the only check that can see a whole class of
  # regression: the pinned pandas 2 suite passes either way. Concretely,
  # reverting `copy=True` in `src/synthweave/stages/noise.py` leaves the
  # pandas 2 suite fully green, so nothing but this job guards that fix.
  test-pandas3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pip install "pandas>=3,<4"
      - run: PYTHONPATH=src python3 -m pytest tests/ -q

  # Hooks are wired locally too (`pre-commit install`), but a local hook is
  # bypassable with --no-verify and absent on a fresh clone, so the real gate
  # is here.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # pyflakes runs as a `local` hook against the system interpreter, so the
      # package's own dev extras have to be present for it to resolve.
      - run: pip install -e ".[dev]"
      - uses: pre-commit/action@v3.0.1

  # This repo's definition of done: a fix is not done until reverting it turns
  # the suite red. It used to be enforced by memory alone, which is how two
  # issues were once logged as fixed with no regression coverage at all.
  #
  # Split across runners because this job was 84% of CI's critical path (about
  # 500s of a 594s median run) while every other job finished in under 70s.
  # Branch protection is `strict: true`, so that one job set the pace of the
  # whole merge queue. `tests/test_mutation_shards.py` asserts these legs are
  # exactly 1..N for the N in the command; drift there would silently stop
  # running some mutations.
  mutation-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard's result is wanted, not just the first failure: a run that
      # stops early hides the other gaps and costs another full cycle to find.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev]"
      # Fails on MISSED (a fix nothing catches) and on STALE (an entry whose
      # snippet or file no longer matches, which verified nothing at all).
      - run: python3 tools/mutation_check.py --shard ${{ matrix.shard }}/6

  # Branch protection requires the check named `mutation-check`, and is
  # deliberately not being edited here, so the gate keeps that exact name and
  # becomes an aggregator over the shards.
  #
  # `if: always()` is load-bearing, not style. Without it, a failing shard
  # leaves this job *skipped* rather than failed, and GitHub documents that a
  # skipped required check may not block merging. That would turn the gate
  # into a no-op precisely when it matters.
  mutation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: mutation-shard
    if: always()
    steps:
      - run: |
          [ "${{ needs.mutation-shard.result }}" = "success" ] || exit 1
