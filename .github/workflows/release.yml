# Publishes a release when a v* tag is pushed.
#
# This workflow is the only path to PyPI, deliberately. v0.1.0 was published
# from a throwaway folder outside this repo, which meant the released artifact
# had no corresponding commit here. Building from the tagged tree makes that
# impossible to repeat by accident.
#
# Authentication is OIDC Trusted Publishing, so there is no API token stored in
# repository secrets to leak or rotate. The publisher must be authorised once on
# pypi.org: project `synthweave`, owner `emmanuelwunjc`, repo `synthweave`,
# workflow `release.yml`.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      # Mints the short-lived OIDC token PyPI exchanges for upload rights.
      id-token: write
      # Creates the GitHub release.
      contents: write
    steps:
      # Pinned to a commit SHA, not the mutable v4/v5/... tag: this job holds
      # id-token: write and publishes to PyPI, so a tag that gets force-moved
      # upstream (it has happened to other widely-used actions) would run
      # with those permissions before anyone here noticed. A commit SHA can't
      # be moved. The version is kept as a trailing comment for readability.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release notes are generated from history since the previous tag,
          # which a shallow clone would not contain.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Not the 3.10 floor the package supports: this job only builds a
          # pure-Python wheel and reads pyproject.toml, and the version guard
          # below needs tomllib, which is stdlib only from 3.11. Compatibility
          # with 3.10 is proven by the test matrix in ci.yml, not here.
          python-version: "3.12"
          cache: pip

      # The tag is the release's claim about what version this is; the built
      # artifact is the truth. Fail loudly when they disagree, rather than
      # publishing something whose filename contradicts its tag.
      - name: Tag must match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$project" ]; then
            echo "tag $GITHUB_REF_NAME implies version $tag, but pyproject.toml says $project" >&2
            exit 1
          fi
          echo "version $project matches tag $GITHUB_REF_NAME"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the built artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          # Notes come from squash-merged PR titles since the previous tag.
          # The repo uses Conventional Commits, so these read as a changelog
          # without anyone maintaining one by hand.
          generate_release_notes: true
