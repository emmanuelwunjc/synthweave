repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: pyflakes
        name: pyflakes
        entry: python3 -m pyflakes
        language: system
        files: ^(src|tests|examples|tools)/
        types: [python]
      # This repo is public, and files .gitignore calls local-only reached
      # public history anyway. .gitignore cannot stop a repeat on its own:
      # `git add -f` bypasses it, and an already-tracked file stays tracked.
      # No `files:` filter on purpose. The point is to see every staged path,
      # including the ones .gitignore would otherwise have hidden.
      - id: leak-guard
        name: leak-guard (private docs and PII)
        entry: python3 tools/check_no_private_leak.py
        language: system
