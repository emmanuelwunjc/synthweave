repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: pyflakes
        name: pyflakes
        entry: python3 -m pyflakes
        language: system
        files: ^(src|tests|examples)/
        types: [python]
