[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthweave"
version = "0.1.0"
description = "Synthetic tabular data that does not require real microdata. Schema-driven generation, statistical synthesis, realistic messiness, and deterministic relational keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yiming Wu" }]
keywords = ["synthetic-data", "administrative-data", "record-linkage", "privacy", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/emmanuelwunjc/synthweave"
Source = "https://github.com/emmanuelwunjc/synthweave"
Issues = "https://github.com/emmanuelwunjc/synthweave/issues"

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
pii = ["Faker>=20"]
dev = ["pytest>=7", "pyarrow>=12", "Faker>=20"]

[tool.hatch.build.targets.wheel]
packages = ["src/synthweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
