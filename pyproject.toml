[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthweave"
version = "0.2.0"
description = "Synthetic tabular data that does not require real microdata. Schema-driven generation, statistical synthesis, realistic messiness, and deterministic relational keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yiming Wu" }]
keywords = ["synthetic-data", "administrative-data", "record-linkage", "privacy", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pandas>=2.0,<3", "numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.7"]

[project.urls]
Homepage = "https://github.com/emmanuelwunjc/synthweave"
Source = "https://github.com/emmanuelwunjc/synthweave"
Issues = "https://github.com/emmanuelwunjc/synthweave/issues"

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
# The Faker upper bound is capped at the current major (40) because
# `connectors/faker_names.py` reads Faker's private provider attributes
# (`Provider.first_names` and friends) for its frequency weights. No break is
# known; the bound exists because a private attribute can change shape in any
# release with no deprecation path. Raise it once a new major is checked
# against `_checked_provider_pool`, and keep `_FAKER_SUPPORTED` in step.
pii = ["Faker>=20,<41"]
dev = ["pytest>=7", "pyarrow>=12", "pyflakes>=3", "Faker>=20,<41"]

[tool.hatch.build.targets.wheel]
packages = ["src/synthweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
